<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Mycelium Lab V2 — Prototype</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#121212;background:#f6f5f2}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}#app{max-width:480px;margin:auto;min-height:100dvh;position:relative;overflow:hidden;background:#f6f5f2}.screen{min-height:100dvh;padding:30px 22px 95px;animation:enter .28s ease}.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase}.heading{font-size:clamp(40px,12vw,62px);line-height:.95;letter-spacing:-.065em;margin:34px 0 28px}.top{display:flex;justify-content:space-between;align-items:center}.plain{border:0;background:transparent;font-size:20px}.bottom{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-around;padding:14px 5px 24px;background:#f6f5f2ee;border-top:1px solid #dedbd5;z-index:15}.bottom button{background:none;border:0;font-size:11px;display:grid;gap:5px;justify-items:center}.bottom b{font-size:22px}.stage{height:56vh;position:relative;perspective:900px;touch-action:pan-y}.specimen{position:absolute;left:6%;width:88%;height:76%;border-radius:18px;overflow:hidden;box-shadow:0 15px 25px #0002;transform-origin:50% 100%;transition:transform .55s cubic-bezier(.2,.9,.2,1),opacity .55s;display:flex;flex-direction:column;justify-content:end;color:white;padding:24px;background-size:cover;background-position:center}.specimen:before{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,#0009)}.specimen>*{position:relative}.specimen h2{font-size:30px;line-height:1;margin:8px 0}.specimen small{font-family:monospace}.specimen[data-depth="0"]{transform:translateY(60px) translateZ(80px) rotateX(0);z-index:4}.specimen[data-depth="1"]{transform:translateY(25px) translateZ(0) scale(.93) rotateX(-7deg);z-index:3}.specimen[data-depth="2"]{transform:translateY(0) translateZ(-75px) scale(.86) rotateX(-12deg);z-index:2}.specimen[data-depth="3"]{transform:translateY(-20px) translateZ(-130px) scale(.79) rotateX(-16deg);z-index:1}.dark{background:#121212!important;color:#fff!important}.dark .bottom{background:#121212ee;border-color:#333}.dark .bottom button{color:white}.small{font-size:12px;color:#777}.dark .small{color:#aaa}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.folder-stage{margin-top:45px;position:relative;height:58vh;perspective:900px}.folder{position:absolute;left:0;right:0;height:230px;border:1px solid #bbb;border-radius:16px 16px 20px 20px;padding:30px 20px;background:#eeede9;box-shadow:0 5px 12px #0001;transition:all .45s;transform:translateY(calc(var(--i)*56px)) translateZ(calc(var(--i)*-15px))}.folder.active{background:#c85a3c;color:white;transform:translateY(calc(var(--i)*56px - 8px)) translateZ(40px)}.folder.open{height:440px;z-index:9;transform:translateY(0) rotateX(-3deg);background:#c85a3c}.folder h2{font-size:27px;margin:0}.folder .tab{position:absolute;top:-24px;left:12px;background:inherit;border:1px solid #bbb;border-bottom:0;border-radius:10px 10px 0 0;padding:5px 14px;font-size:12px}.mini{background:#fff;color:#111;border-radius:14px;padding:15px;margin-top:18px}.hero{height:100dvh;background:radial-gradient(circle at 40% 40%,#f8d6b4,#a75331 40%,#392a23 75%);position:relative;color:white;padding:25px;overflow:hidden}.hero:after{content:"";position:absolute;inset:0;opacity:.35;background:repeating-radial-gradient(ellipse at 45% 55%,transparent 0 8px,#fff8 9px 10px,transparent 11px 24px);pointer-events:none}.hero h1{font-size:43px;line-height:1;position:relative;z-index:1}.sheet{position:absolute;bottom:0;left:0;right:0;height:10%;min-height:90px;border-radius:25px 25px 0 0;background:#f6f5f2bb;backdrop-filter:blur(16px);color:#111;z-index:2;padding:17px 22px;transition:height .45s,background .45s;touch-action:pan-y;overflow:auto}.sheet.mid{height:50%;background:#f6f5f2e8}.sheet.full{height:93%;background:#f6f5f2}.handle{width:42px;height:4px;border-radius:8px;background:#999;margin:0 auto 17px}.tabs{display:flex;overflow:auto;gap:18px;margin:25px 0;white-space:nowrap}.tabs button{border:0;background:transparent;padding:8px 0}.tabs button.selected{border-bottom:2px solid #c85a3c}.data{border-bottom:1px solid #ddd;padding:16px 0;display:flex;justify-content:space-between}.photos{display:flex;height:58vh;overflow:hidden;border-radius:16px;touch-action:none;margin-top:20px}.photo{width:50%;overflow:hidden;position:relative;background:#b95b35}.photo:nth-child(2){background:#c45569}.texture{width:100%;height:100%;transform-origin:center; background:repeating-radial-gradient(ellipse at 35% 45%,#fff9 0 2px,transparent 3px 12px,#fff6 14px 16px,transparent 18px 33px),radial-gradient(#f2c7a0,#b95b35);}.photo:nth-child(2) .texture{background:repeating-radial-gradient(ellipse at 60% 45%,#fff9 0 2px,transparent 3px 12px,#fff6 14px 16px,transparent 18px 33px),radial-gradient(#ffbbc1,#ad3047)}.photo span{position:absolute;top:12px;left:12px;color:#111;background:#f6f5f2d9;border-radius:8px;padding:8px;font-size:12px}.button{background:#121212;color:white;border:0;border-radius:30px;padding:17px 25px;width:100%;font-weight:600}.line{height:2px;background:#ddd;margin:15px 0 45px}.line i{display:block;height:100%;background:#c85a3c}.field{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ddd;padding:18px 0}.field input{width:85px;border:0;background:transparent;text-align:right}.wizard-footer{position:absolute;bottom:100px;left:22px;right:22px}.navlink{border:0;background:transparent;text-decoration:underline}.hint{text-align:center;margin:5px 0;color:#777;font-size:12px}@keyframes enter{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
</style><div id="app"></div><script>
const app=document.querySelector('#app');let page='home',card=0,activeFolder=0,folderOpen=false,sheet=0,tab='Recette',step=0,zoom=1,dx=0,dy=0,dark=false;const items=[['A07','Ganoderma lucidum','#c85a3c'],['B04','Trametes sanguinea','#b7a8ff'],['C03','Co-culture','#a1a58c'],['A08','Ganoderma lucidum','#b78361']];const demo=[['Copeaux de hêtre','1000'],['Son de blé','300'],['Eau','650']];function go(p){page=p;render()}function nav(){return `<nav class="bottom">${[['home','Accueil','⌂'],['archives','Archives','▤'],['create','Créer','＋'],['compare','Comparer','◫']].map(([p,t,i])=>`<button onclick="go('${p}')"><b>${i}</b>${t}</button>`).join('')}</nav>`}function head(title){return `<div class="top"><button class="plain" onclick="go('home')">←</button><span class="eyebrow">${title}</span><button class="plain" onclick="go('create')">＋</button></div>`}function render(){app.className=dark&&page==='home'?'dark':'';if(page==='home'){app.innerHTML=`<main class="screen"><div class="top"><span class="eyebrow">MYCELIUM LAB / V2</span><button class="plain" onclick="dark=!dark;render()">◐</button></div><h1 class="heading">Mycelium<br>Lab.</h1><div class="stage" id="stage">${items.map((x,i)=>{let d=(i-card+items.length)%items.length;return `<article class="specimen" data-depth="${d}" style="background-image:radial-gradient(circle at 40% 35%,#ffffff8a,transparent 35%),repeating-radial-gradient(ellipse at 50% 50%,#ffffff70 0 2px,transparent 3px 19px),linear-gradient(130deg,${x[2]},#28221f)" onclick="${d===0?"go('detail')":"card="+i+";render()"}"><small>${x[0]} / EXPÉRIENCE</small><h2>${x[1]}</h2></article>`}).join('')}</div><p class="hint">↑ Glisser pour explorer · Toucher pour ouvrir</p></main>${nav()}`;let s=document.querySelector('#stage'),y=0;s.addEventListener('touchstart',e=>y=e.touches[0].clientY,{passive:true});s.addEventListener('touchend',e=>{let d=e.changedTouches[0].clientY-y;if(Math.abs(d)>35){card=(card+(d<0?1:items.length-1))%items.length;dark=true;render()}},{passive:true});s.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>10){card=(card+(e.deltaY>0?1:items.length-1))%items.length;dark=true;render()}},{passive:true})}else if(page==='archives'){app.innerHTML=`<main class="screen">${head('ARCHIVES')}<h1 class="heading">Archives.</h1><p class="small">Parcourir les collections</p><div class="folder-stage">${['Ganoderma','Trametes','Co-cultures','Autres essais'].map((x,i)=>`<div class="folder ${i===activeFolder?'active':''} ${folderOpen&&i===activeFolder?'open':''}" style="--i:${i}" onclick="if(activeFolder===${i})folderOpen=!folderOpen;else{activeFolder=${i};folderOpen=false}render()"><div class="tab">0${i+1} / ${x}</div><h2>${x}</h2>${folderOpen&&i===activeFolder?`<div class="mini" onclick="event.stopPropagation();go('detail')">A07 — Ouvrir une fiche →</div><div class="mini" onclick="event.stopPropagation();go('detail')">A08 — Ouvrir une fiche →</div>`:''}</div>`).join('')}</div></main>${nav()}`}else if(page==='detail'){app.innerHTML=`<div class="hero"><button class="plain" style="color:white;position:relative;z-index:3" onclick="go('archives')">←</button><h1>A07<br>Ganoderma<br>lucidum.</h1><div class="sheet ${sheet===1?'mid':sheet===2?'full':''}" id="sheet"><div class="handle"></div><div class="row"><b>A07 · Ganoderma lucidum</b><button class="plain" onclick="sheet=(sheet+1)%3;render()">${sheet===2?'↓':'↑'}</button></div>${sheet>0?`<div class="tabs">${['Recette','Observations','Résultats','Médias'].map(t=>`<button class="${tab===t?'selected':''}" onclick="tab='${t}';render()">${t}</button>`).join('')}</div>${(tab==='Recette'?demo:tab==='Observations'?[['J0','Photo et notes initiales'],['J7','Ajouter une observation']]:tab==='Résultats'?[['Statut','Non évalué'],['Mesures','Aucune mesure saisie']]:[['Photographies','Ajouter une image']]).map(x=>`<div class="data"><span>${x[0]}</span><span>${x[1]}</span></div>`).join('')}`:''}</div></div>`;let s=document.querySelector('#sheet'),y=0;s.addEventListener('touchstart',e=>y=e.touches[0].clientY,{passive:true});s.addEventListener('touchend',e=>{let d=e.changedTouches[0].clientY-y;if(Math.abs(d)>40){sheet=Math.max(0,Math.min(2,sheet+(d<0?1:-1)));render()}},{passive:true})}else if(page==='compare'){app.innerHTML=`<main class="screen">${head('COMPARATEUR')}<h1 class="heading">Comparer.</h1><div class="row"><b>A07 · Ganoderma</b><b>B04 · Trametes</b></div><div class="photos" id="photos">${[0,1].map(i=>`<div class="photo"><div class="texture" style="transform:translate(${dx}px,${dy}px) scale(${zoom})"></div><span>${i?'B04':'A07'}</span></div>`).join('')}</div><p class="hint">Pincer pour zoomer · Glisser pour déplacer · Double toucher pour réinitialiser</p><div class="tabs">${['Propriétés','Formulation','Observations','Résultats'].map(t=>`<button class="${tab===t?'selected':''}" onclick="tab='${t}';render()">${t}</button>`).join('')}</div><div class="data"><span>${tab}</span><span>Comparer les données enregistrées</span></div><div class="data"><span>Statut</span><span>Données de démonstration</span></div></main>${nav()}`;let el=document.querySelector('#photos'),last=null,lastTap=0;el.addEventListener('touchstart',e=>{last=[...e.touches].map(t=>[t.clientX,t.clientY]);if(Date.now()-lastTap<300){zoom=1;dx=dy=0;render()}lastTap=Date.now()},{passive:true});el.addEventListener('touchmove',e=>{e.preventDefault();if(!last)return;let now=[...e.touches].map(t=>[t.clientX,t.clientY]);if(now.length===2&&last.length===2){let dist=a=>Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);zoom=Math.min(5,Math.max(1,zoom*dist(now)/Math.max(1,dist(last))))}else if(now.length===1&&last.length===1){dx+=now[0][0]-last[0][0];dy+=now[0][1]-last[0][1]}last=now;el.querySelectorAll('.texture').forEach(t=>t.style.transform=`translate(${dx}px,${dy}px) scale(${zoom})`)},{passive:false});el.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.min(5,Math.max(1,zoom+(e.deltaY<0?.15:-.15)));el.querySelectorAll('.texture').forEach(t=>t.style.transform=`translate(${dx}px,${dy}px) scale(${zoom})`)},{passive:false})}else if(page==='create'){let labels=['Espèce.','Formulation.','Culture.','Observations.'];let content=[`<p>Choisissez le mycélium à étudier.</p>${['Ganoderma lucidum','Trametes sanguinea','Co-culture','Autre espèce'].map((x,i)=>`<label class="field">${x}<input type="radio" name="species" ${i===0?'checked':''}></label>`).join('')}`,`<p>Composez votre substrat.</p>${demo.map(x=>`<label class="field">${x[0]}<span><input type="number" value="${x[1]}"> g</span></label>`).join('')}<button class="navlink" onclick="alert('Fonction à connecter aux données réelles')">＋ Ajouter un ingrédient</button>`,`<p>Définissez les conditions de culture.</p>${[['Contenant','Moule rigide'],['Température','24 °C'],['Humidité relative','Non renseignée'],['Durée prévue','14 jours']].map(x=>`<div class="field"><span>${x[0]}</span><span>${x[1]}</span></div>`).join('')}`,`<p>Ajoutez une première observation (facultatif).</p><label class="field">Photographie <input type="file" accept="image/*" style="width:135px"></label><textarea placeholder="Notes d'observation" style="width:100%;height:130px;border:0;border-bottom:1px solid #ddd;background:transparent;margin-top:20px"></textarea>`];app.innerHTML=`<main class="screen">${head('NOUVELLE EXPÉRIENCE')}<div class="row" style="margin-top:35px"><span class="eyebrow">NOUVELLE EXPÉRIENCE</span><span class="eyebrow">0${step+1} / 04</span></div><div class="line"><i style="width:${(step+1)*25}%"></i></div><h1 class="heading">${labels[step]}</h1>${content[step]}<div class="wizard-footer"><button class="button" onclick="${step===3?"alert('Prototype : aucune donnée enregistrée.');go('detail')":"step++;render()"}">${step===3?'Terminer la démonstration':'Suivant →'}</button>${step>0?`<p class="hint"><button class="navlink" onclick="step--;render()">← Précédent</button></p>`:''}</div></main>${nav()}`}}render();
</script></html>
